aid: country-financial
name: COUNTRY Financial
kind: company
description: >-
  COUNTRY Financial is the marketing name for an Illinois-headquartered family
  of affiliated insurance and financial services companies that includes
  COUNTRY Life Insurance Company, COUNTRY Mutual Insurance Company, COUNTRY
  Casualty Insurance Company, COUNTRY Preferred Insurance Company, and
  related subsidiaries based in Bloomington, IL. Founded in 1925 by Illinois
  Agricultural Association members, COUNTRY today offers auto, home, life,
  farm, crop, and commercial insurance along with investment, retirement
  planning, and trust services through a captive agent network in 19 U.S.
  states. COUNTRY does not publish a public developer API; partner and
  agency integrations occur through internal agency systems.
